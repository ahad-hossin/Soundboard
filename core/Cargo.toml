[package]
name = "soundboard-core"
version = "0.1.0"
edition = "2021"
authors = ["Ahad Hossin (Yokitori)"]

[lib]
name = "soundboard_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
log = "0.4"
rodio = "0.20"
ringbuf = "0.4"
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
infer = "0.16"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
hound = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
